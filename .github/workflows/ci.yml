name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every main run finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # Room for a slow apt mirror during the WebKit install (once took 15 min).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heartpatch
          POSTGRES_PASSWORD: heartpatch
          POSTGRES_DB: heartpatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartpatch -d heartpatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # DB integration tests fail (not skip) in CI without this.
      DATABASE_URL: postgres://heartpatch:heartpatch@localhost:5432/heartpatch
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrations match the schema
        run: |
          pnpm db:check
          # Fail fast if drizzle-kit stops to ask about an ambiguous rename.
          timeout 120 pnpm db:generate
          if [ -n "$(git status --porcelain -- apps/server/src/db/migrations)" ]; then
            git status --porcelain -- apps/server/src/db/migrations
            echo "::error::Schema changed without a migration. Run pnpm db:generate and commit the result."
            exit 1
          fi

      - run: pnpm test
      - name: Coverage thresholds (shared game logic)
        run: pnpm --filter @heartpatch/shared test:coverage
      - run: pnpm build

      - name: DB scripts from scratch (migrate + seed, twice each)
        run: |
          pnpm db:migrate && pnpm db:migrate
          pnpm db:seed && pnpm db:seed

      # Cache the browser download; the OS packages it needs still install each run.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright WebKit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @heartpatch/client exec playwright install --with-deps webkit

      - name: Install Playwright WebKit system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @heartpatch/client exec playwright install-deps webkit

      - name: E2E smoke (iPhone + iPad, WebKit)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 7
