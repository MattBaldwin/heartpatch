name: CI

on:
  pull_request:
    # ready_for_review: a draft skips e2e, so marking it ready runs everything.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every main run finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # @playwright/test in the lockfile. The e2e container tag below must say the
  # same (container.image can't read env), and an e2e step checks both.
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  # Does this PR touch anything the game is built or tested from? A draft PR,
  # or one that only changes docs (docs/, root *.md, .claude/), skips the
  # browser tests;
  # `fast` still runs in full. Pushes to main always run everything.
  # changes/*.md is the in-app What's new, so it counts as game content.
  # --no-renames lists a moved file's old path too, so moving code into docs/
  # still runs e2e. grep reads from a here-string, not a pipe: under pipefail a
  # `grep -q` that exits early can kill the writer and flip the result.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip_e2e: ${{ steps.diff.outputs.skip_e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$DRAFT" = true ]; then
            echo "Draft PR: e2e runs when it's marked ready"
            echo "skip_e2e=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only --no-renames "$BASE...$HEAD")"
          echo "$files"
          if [ -n "$files" ] && ! grep -qvE '^(docs/|\.claude/|[^/]+\.md$)' <<< "$files"; then
            echo "skip_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
          fi

  # Lint, types, unit and DB tests, build: everything but the browser.
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16 # Google's Docker Hub mirror: same image, no anonymous pull rate limit
        env:
          POSTGRES_USER: heartpatch
          POSTGRES_PASSWORD: heartpatch
          POSTGRES_DB: heartpatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartpatch -d heartpatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # DB integration tests fail (not skip) in CI without this.
      DATABASE_URL: postgres://heartpatch:heartpatch@localhost:5432/heartpatch
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the app's build number is the commit count (#198).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrations match the schema
        run: |
          pnpm db:check
          # Fail fast if drizzle-kit stops to ask about an ambiguous rename.
          timeout 120 pnpm db:generate
          if [ -n "$(git status --porcelain -- apps/server/src/db/migrations)" ]; then
            git status --porcelain -- apps/server/src/db/migrations
            echo "::error::Schema changed without a migration. Run pnpm db:generate and commit the result."
            exit 1
          fi

      - run: pnpm test
      - name: Coverage thresholds (shared game logic)
        run: pnpm --filter @heartpatch/shared test:coverage
      - run: pnpm build

      - name: DB scripts from scratch (migrate + seed, twice each)
        run: |
          pnpm db:migrate && pnpm db:migrate
          pnpm db:seed && pnpm db:seed

  # WebKit e2e, split by device and into groups that run side by side.
  e2e:
    needs: changes
    if: needs.changes.outputs.skip_e2e != 'true'
    runs-on: ubuntu-24.04
    # WebKit and its OS packages come preinstalled in the official Playwright
    # image, so no shard downloads from an apt mirror (a slow one timed jobs
    # out on 2026-10-07 even with retries). Its tag must equal PLAYWRIGHT_VERSION
    # (top of file); a step below checks that against the lockfile.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble # = PLAYWRIGHT_VERSION
      options: --ipc=host
    # Room for the image pull and setup (about 1 min) and the slowest group's
    # tests (about 10 min since #246 rebalanced them), with slack for a slow
    # runner and a retry or two.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-webkit, ipad-webkit]
        # Six groups of spec files balanced by measured duration (E2E_GROUPS
        # in apps/client/playwright.config.ts), which lists every spec: an
        # unlisted one fails the run. Playwright's --shard splits by test
        # count in file order, which left ipad shard 1 of 3 at ~12 min while
        # the others took 3-4. The config fails the run if this count doesn't
        # match its own.
        group: [1, 2, 3, 4, 5, 6]
    services:
      # Named "db" like the compose service, which the seed script's
      # refuse-a-remote-database guard allows.
      db:
        image: mirror.gcr.io/library/postgres:16 # Google's Docker Hub mirror: same image, no anonymous pull rate limit
        env:
          POSTGRES_USER: heartpatch
          POSTGRES_PASSWORD: heartpatch
          POSTGRES_DB: heartpatch
        options: >-
          --health-cmd "pg_isready -U heartpatch -d heartpatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # The dev server and the db scripts need this. Inside a container job the
      # service is reached by its name, not localhost.
      DATABASE_URL: postgres://heartpatch:heartpatch@db:5432/heartpatch
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the app's build number is the commit count (#198).
          fetch-depth: 0

      # The workspace is owned by the runner user but steps here run as root,
      # so git would refuse it ("dubious ownership") and the build number
      # (commit count, #198) would fall back to dev.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Playwright image matches the lockfile
        shell: bash
        run: |
          want="$(pnpm --filter @heartpatch/client exec playwright --version | awk '{print $2}')"
          test -n "$want" || { echo "::error::Couldn't read the lockfile's Playwright version"; exit 1; }
          echo "image v$PLAYWRIGHT_VERSION, lockfile v$want"
          test "$want" = "$PLAYWRIGHT_VERSION" || { echo "::error::Set PLAYWRIGHT_VERSION and the e2e container tag in ci.yml to $want"; exit 1; }
          grep -q "playwright:v$PLAYWRIGHT_VERSION-noble" .github/workflows/ci.yml || { echo "::error::The e2e container tag in ci.yml doesn't match PLAYWRIGHT_VERSION"; exit 1; }

      # The specs import @heartpatch/shared's built output.
      - run: pnpm --filter @heartpatch/shared build
      - run: pnpm db:migrate && pnpm db:seed

      - name: E2E (${{ matrix.project }}, group ${{ matrix.group }}/6)
        env:
          HP_E2E_GROUP: ${{ matrix.group }}/6
        run: >-
          pnpm --filter @heartpatch/client exec playwright test
          --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.group }}
          path: apps/client/playwright-report/
          retention-days: 7

  # The one status to require and to gate merges on: green only when every
  # job above is.
  check:
    if: always()
    needs: [changes, fast, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        run: |
          echo "changes: ${{ needs.changes.result }}, skip e2e: ${{ needs.changes.outputs.skip_e2e }}"
          echo "fast: ${{ needs.fast.result }}, e2e: ${{ needs.e2e.result }}"
          test "${{ needs.changes.result }}" = success
          test "${{ needs.fast.result }}" = success
          if [ "${{ needs.changes.outputs.skip_e2e }}" = true ]; then
            test "${{ needs.e2e.result }}" = skipped
          else
            test "${{ needs.e2e.result }}" = success
          fi
