name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every main run finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, types, unit and DB tests, build: everything but the browser.
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heartpatch
          POSTGRES_PASSWORD: heartpatch
          POSTGRES_DB: heartpatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartpatch -d heartpatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # DB integration tests fail (not skip) in CI without this.
      DATABASE_URL: postgres://heartpatch:heartpatch@localhost:5432/heartpatch
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the app's build number is the commit count (#198).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrations match the schema
        run: |
          pnpm db:check
          # Fail fast if drizzle-kit stops to ask about an ambiguous rename.
          timeout 120 pnpm db:generate
          if [ -n "$(git status --porcelain -- apps/server/src/db/migrations)" ]; then
            git status --porcelain -- apps/server/src/db/migrations
            echo "::error::Schema changed without a migration. Run pnpm db:generate and commit the result."
            exit 1
          fi

      - run: pnpm test
      - name: Coverage thresholds (shared game logic)
        run: pnpm --filter @heartpatch/shared test:coverage
      - run: pnpm build

      - name: DB scripts from scratch (migrate + seed, twice each)
        run: |
          pnpm db:migrate && pnpm db:migrate
          pnpm db:seed && pnpm db:seed

  # WebKit e2e, split by device and into groups that run side by side.
  e2e:
    runs-on: ubuntu-24.04
    # Room for setup (about 4 min), the WebKit system deps (capped at 17 min,
    # below) and the tests in the heaviest group (about 5 min).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [iphone-webkit, ipad-webkit]
        # Five groups of spec files balanced by measured duration (E2E_GROUPS
        # in apps/client/playwright.config.ts); group 5 is every spec not
        # listed there. Playwright's --shard splits by test count in file
        # order, which left ipad shard 1 of 3 at ~12 min while the others took
        # 3-4. The config fails the run if this count doesn't match its own.
        group: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heartpatch
          POSTGRES_PASSWORD: heartpatch
          POSTGRES_DB: heartpatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartpatch -d heartpatch"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # The dev server and the db scripts need this.
      DATABASE_URL: postgres://heartpatch:heartpatch@localhost:5432/heartpatch
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the app's build number is the commit count (#198).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The specs import @heartpatch/shared's built output.
      - run: pnpm --filter @heartpatch/shared build
      - run: pnpm db:migrate && pnpm db:seed

      # Cache the browser download; the OS packages it needs still install each run.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # A slow apt mirror held shards in the OS-package install for 29 min, so
      # jobs timed out before any test ran. apt gives up on a silent
      # connection after 30 s and waits up to 60 s for a lock. dpkg stays off
      # its own pty, so it stays in the process group the retry cap below can
      # stop.
      - name: apt retries and timeouts
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' 'Dpkg::Use-Pty "0";' 'DPkg::Lock::Timeout "60";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-retries

      - name: Install Playwright WebKit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @heartpatch/client exec playwright install webkit

      # A mirror that trickles is caught by the 5-min cap on each try, which
      # retries on a fresh connection. The cap runs as root: Playwright then
      # calls apt itself, and a signal from the runner user couldn't reach a
      # root apt started through sudo, so its lock would outlive the try.
      - name: Install Playwright WebKit system deps
        timeout-minutes: 17
        run: |
          for try in 1 2 3; do
            sudo env "PATH=$PATH" timeout -k 30s 5m apps/client/node_modules/.bin/playwright install-deps webkit && exit 0
            echo "::warning::install-deps try $try of 3 failed or took over 5 min"
            sudo dpkg --configure -a || echo "::warning::dpkg --configure -a failed after try $try"
          done
          exit 1

      - name: E2E (${{ matrix.project }}, group ${{ matrix.group }}/5)
        env:
          HP_E2E_GROUP: ${{ matrix.group }}/5
        run: >-
          pnpm --filter @heartpatch/client exec playwright test
          --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.group }}
          path: apps/client/playwright-report/
          retention-days: 7

  # The one status to require and to gate merges on: green only when every
  # job above is.
  check:
    if: always()
    needs: [fast, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        run: |
          echo "fast: ${{ needs.fast.result }}, e2e: ${{ needs.e2e.result }}"
          test "${{ needs.fast.result }}" = success
          test "${{ needs.e2e.result }}" = success
