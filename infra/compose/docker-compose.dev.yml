# Local Postgres for development: `pnpm db:up`, then `pnpm db:migrate` and
# `pnpm db:seed`. Matches DATABASE_URL in .env.example. Dev-only credentials.
name: heartpatch-dev

services:
  db:
    # Same image as CI (glibc), so text collation and ordering match.
    image: postgres:16
    environment:
      POSTGRES_USER: heartpatch
      POSTGRES_PASSWORD: heartpatch
      POSTGRES_DB: heartpatch
    ports:
      # Loopback only, so the dev database isn't reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heartpatch -d heartpatch']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
